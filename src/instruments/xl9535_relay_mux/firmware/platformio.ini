; USB-to-I2C bridge for the XL9535 relay board, on a SparkFun ESP32-C6 Qwiic Pocket
; (ESP32-C6FH4, 4 MB flash). Its variant puts I2C on GPIO 6 (SDA) and 7 (SCL), the Qwiic
; connector, and Serial on the C6's USB-Serial/JTAG port. The generic C6 board uses other
; pins and can't reach the relay board. The firmware this replaced was built in the
; Arduino IDE for the same board, with Arduino core 3.3.10.
;
; The official espressif32 platform has no Arduino core for the C6, so this uses the
; community pioarduino platform (Arduino core 3.3.11), pinned to a release.
;
;   pixi run -e firmware pio run -d src/instruments/xl9535_relay_mux/firmware
;   pixi run -e firmware pio run -d src/instruments/xl9535_relay_mux/firmware -t upload

[env:qwiic_pocket_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = sparkfun_qwiic_pocket_esp32c6
framework = arduino
lib_deps = jfjlaros/simpleRPC@3.2.0
monitor_speed = 115200
