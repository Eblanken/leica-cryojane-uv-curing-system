[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qr101b"
version = "0.1.0"
description = "Eastwood QR101B resistance box: generic driver, simulator and Bluesky device."
requires-python = ">=3.13"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
bluesky = ["ophyd>=1.11,<2", "ophyd-adapters"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qr101b*"]
