[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdm8341"
version = "0.1.0"
description = "GW Instek GDM-8341 multimeter: generic driver, simulator and Bluesky device."
requires-python = ">=3.13"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
bluesky = ["ophyd>=1.11,<2", "ophyd-adapters"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gdm8341*"]
