[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryojane-bench"
version = "0.1.0"
description = "Shared instrument drivers and analysis code for CryoJane bench scripts."
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["."]
include = ["cryojane_bench*"]
